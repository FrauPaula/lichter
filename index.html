<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dein Name in Lichtern</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#1b1830;color:#fff5e0;text-align:center;padding:20px}
h1{color:#fdf295;font-size:1.6em}
input{font-size:1.3em;padding:10px;border-radius:10px;border:2px solid #fdf295;max-width:80%}
button{font-size:1.2em;padding:10px 18px;border-radius:10px;border:0;background:#fdf295;color:#32302e;margin:8px;cursor:pointer}
.reihe{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.bu{width:36px;font-size:1.5em;font-weight:bold;color:#fdf295}
.code{width:70px;font-family:monospace;font-size:1.1em}
.kerze{width:22px;height:46px;position:relative}
.kerze .wachs{position:absolute;bottom:0;left:3px;width:16px;height:30px;background:#fff5e0;border-radius:3px}
.kerze .flamme{position:absolute;bottom:30px;left:5px;width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#ffb347;box-shadow:0 0 14px 6px #ffcc66;animation:f 1s infinite alternate}
.aus .flamme{background:#555;box-shadow:none;height:4px;animation:none}
.aus .wachs{background:#8a8577}
@keyframes f{to{transform:scale(1.1) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.kerze .flamme{animation:none}}
p.info{max-width:520px;margin:10px auto;opacity:.9}
</style></head><body>
<h1>✨ Dein Name in Lichtern ✨</h1>
<p class="info">Jeder Buchstabe hat eine Zahl: A=1, B=2 … Z=26. Der Computer schreibt sie mit 5 Lichtern: Kerze an = 1, Kerze aus = 0.</p>
<input id="name" maxlength="15" placeholder="Dein Name" autocomplete="off">
<button id="los">Lichter an!</button>
<div id="aus"></div>
<p class="info" style="font-size:.85em">Dein Name wird nirgends gespeichert und nicht verschickt.</p>
<script>
const um={'Ä':'AE','Ö':'OE','Ü':'UE','ß':'SS'};
function zeige(){
 const out=document.getElementById('aus');out.innerHTML='';
 let n=document.getElementById('name').value.toUpperCase().replace(/[ÄÖÜß]/g,c=>um[c]).replace(/[^A-Z]/g,'');
 for(const ch of n){
  const z=ch.charCodeAt(0)-64,b=z.toString(2).padStart(5,'0');
  const r=document.createElement('div');r.className='reihe';
  r.innerHTML=`<span class="bu">${ch}</span>`+[...b].map(x=>`<div class="kerze ${x==='1'?'':'aus'}"><div class="flamme"></div><div class="wachs"></div></div>`).join('')+`<span class="code">${b}</span>`;
  out.appendChild(r);
 }
}
document.getElementById('los').onclick=zeige;
document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter')zeige()});
</script></body></html>
